# Infrastructure-as-code for the backend on Render.
#
# The database is hosted separately on Neon (serverless Postgres), so
# DATABASE_URL is set manually in the dashboard rather than provisioned here.
# The frontend deploys separately as a static site (see README > Deployment).
services:
  - type: web
    name: rfq-marketplace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: JWT_SECRET
        sync: false          # python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false          # the deployed frontend origin, no trailing slash
