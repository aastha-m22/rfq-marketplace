# Infrastructure-as-code for the backend on Render.
# The frontend deploys separately as a static site (see README > Deployment).
services:
  - type: web
    name: rfq-marketplace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rfq-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false                  # set to your deployed frontend URL

databases:
  - name: rfq-marketplace-db
    databaseName: rfq
    plan: free
